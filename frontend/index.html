<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b0710">
<title>Ishq e Mehfil – Ticket Verification</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mandala m-tl" aria-hidden="true"></div>
<div class="mandala m-br" aria-hidden="true"></div>

<div id="offline" class="offline" role="alert" hidden>Connection lost. Tickets cannot be verified until you are back online.</div>

<main class="shell">
  <header class="brand">
    <img class="logo" src="assets/logo.png" alt="Ishq e Mehfil" width="320" height="210">
    <h1>ISHQ E MEHFIL</h1>
    <p class="subtitle">OFFICIAL TICKET VERIFICATION PORTAL</p>
  </header>

  <!-- Verification -->
  <section id="verifyScreen">
    <div class="glass card verify">
      <h2>Enter Your Serial No.</h2>
      <p class="muted">Verify your ticket to proceed with entry.</p>
      <div class="field-wrap">
        <input id="serial" class="field" type="text" inputmode="text" maxlength="12"
               placeholder="Enter Ticket Serial Number" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Ticket serial number"
               autocapitalize="characters"
               >
      </div>
      <button id="verifyBtn" class="btn" type="button"><span class="btn-label">VERIFY NOW</span><span class="spinner" aria-hidden="true"></span></button>
      <p id="inlineError" class="inline-error" role="alert" hidden></p>
    </div>

    <div class="stats" aria-live="polite">
      <div class="glass stat"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg><b id="sTotal">–</b><span>Total Tickets</span></div>
      <div class="glass stat ok"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg><b id="sVerified">–</b><span>Verified Tickets</span></div>
      <div class="glass stat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b id="sRemaining">–</b><span>Remaining Tickets</span></div>
    </div>
  </section>

  <footer>Powered by FRONTLINERS </footer>
</main>

<div id="overlay" class="overlay" hidden>
  <div id="modal" class="modal glass" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
    <div id="mIcon" class="m-icon" aria-hidden="true"></div>
    <h3 id="mTitle"></h3>
    <p id="mText" class="m-text"></p>
    <dl id="mDetails" class="details"></dl>
    <div id="mBanner" class="banner"></div>
    <button id="againBtn" class="btn" type="button">SEARCH AGAIN</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
